name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-version:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          test -n "$version"
          test "$tag" = "$version"

  build-macos:
    name: Build ${{ matrix.target }}
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify source
        run: |
          cargo fmt --check
          cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package archive
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          package="relay-sync-${version}-${TARGET}"
          mkdir -p "dist/${package}"
          cp "target/${TARGET}/release/relay-sync" "dist/${package}/relay-sync"
          chmod 755 "dist/${package}/relay-sync"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          (
            cd dist
            shasum -a 256 "${package}.tar.gz" > "${package}.tar.gz.sha256"
          )
          file "dist/${package}/relay-sync"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-macos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create combined checksum file
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum *.tar.gz > SHA256SUMS
      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --generate-notes --title "relay-sync $TAG"
