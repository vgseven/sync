name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  # A newer commit on the same branch supersedes an older validation run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Run static checks
        run: cargo check --all-targets --locked
      - name: Run tests
        run: cargo test --locked

  release-config:
    name: Validate cargo-dist configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned cargo-dist release tool
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Verify generated release workflow is current
        run: dist generate --check --mode ci
      - name: Validate release artifacts and installer plan
        run: dist plan --output-format=json --no-local-paths > /dev/null
