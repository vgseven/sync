[workspace]
members = ["cargo:."]

# cargo-dist reads this workspace-level file to generate release artifacts,
# the public shell installer, and .github/workflows/release.yml.
[dist]
# Keep the release tool version pinned so local and GitHub builds agree.
cargo-dist-version = "0.32.0"
# GitHub Releases are both the artifact host and the release announcement path.
ci = ["github"]
# This produces relay-sync-installer.sh for the documented curl | sh command.
installers = ["shell"]
# The initial public release supports native Apple Silicon Macs only.
# Add x86_64-apple-darwin only when Intel macOS support is intentionally tested.
targets = ["aarch64-apple-darwin"]
# Install without requiring Rust or polluting Cargo's own binary directory.
install-path = "~/.local/bin"
# Make checksum generation explicit; the shell installer embeds the selected hash.
checksum = "sha256"
# Updates are delivered by rerunning the installer, not by a background updater.
install-updater = false
