[package]
name = "relay-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Cross-platform dependency auditing and manifest updates for Python and Node.js projects"
license = "MIT"
repository = "https://github.com/vgseven/sync"
homepage = "https://github.com/vgseven/sync"
readme = "README.md"
keywords = ["dependencies", "python", "node", "cli", "updater"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml_edit = { version = "0.22", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
